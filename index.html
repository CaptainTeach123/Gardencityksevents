<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garden City Event Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #667085; --line: #e3e6ec;
    --active: #16a34a; --upcoming: #2563eb; --ended: #98a2b3; --accent: #2563eb;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text); background: var(--bg); }
  .app { display: grid; grid-template-columns: 380px 1fr; height: 100%; }
  .side { display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line); min-height: 0; }
  #map { height: 100%; width: 100%; }

  header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0 0 2px; font-size: 18px; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }

  .controls { padding: 12px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { min-width: 0; }
  label.field { display: grid; gap: 3px; font-size: 12px; color: var(--muted); flex: 1; }
  input[type=date], input[type=time], select {
    font: inherit; color: var(--text); padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; background: #fff; width: 100%;
  }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: #fff; color: var(--text); border-radius: 8px; padding: 7px 10px; }
  button:hover { background: #f1f3f7; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #1d4ed8; }
  .slider-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: -4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border-radius: 999px; padding: 4px 10px; font-size: 13px; display: inline-flex; gap: 5px; align-items: center; }
  .chip[aria-pressed=false] { opacity: .45; }
  .check { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }

  .summary { padding: 8px 16px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); display: flex; gap: 12px; flex-wrap: wrap; }
  .summary b { color: var(--text); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; }

  .list { overflow-y: auto; flex: 1; padding: 6px 8px 16px; }
  .item { display: block; width: 100%; text-align: left; border: 0; border-radius: 10px; padding: 9px 10px; background: transparent; }
  .item:hover, .item:focus-visible { background: #f1f3f7; }
  .item .t { font-weight: 600; display: flex; gap: 6px; align-items: center; }
  .item .m { color: var(--muted); font-size: 13px; }
  .empty { padding: 24px 16px; color: var(--muted); text-align: center; }

  .badge { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; color: #fff; white-space: nowrap; }
  .badge.active { background: var(--active); }
  .badge.upcoming { background: var(--upcoming); }
  .badge.ended { background: var(--ended); }

  /* map pins */
  .pin { position: relative; width: 36px; height: 36px; border-radius: 50%; background: #fff; border: 3px solid var(--ring);
         display: grid; place-items: center; font-size: 17px; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
  .pin.active { --ring: var(--active); }
  .pin.upcoming { --ring: var(--upcoming); }
  .pin.ended { --ring: var(--ended); opacity: .7; }
  .pin.active::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 3px solid var(--active); animation: pulse 1.6s ease-out infinite; }
  .pin .n { position: absolute; top: -7px; right: -7px; background: #1d2330; color: #fff; font: 700 11px/18px system-ui; min-width: 18px; height: 18px; border-radius: 9px; text-align: center; padding: 0 4px; }
  @keyframes pulse { from { transform: scale(1); opacity: .9; } to { transform: scale(1.7); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .pin.active::after { animation: none; } }

  .leaflet-popup-content { margin: 12px 14px; min-width: 220px; }
  .pop h3 { margin: 0 0 6px; font-size: 15px; }
  .pop .ev { padding: 6px 0; border-top: 1px solid var(--line); }
  .pop .ev:first-of-type { border-top: 0; }
  .pop .ev .t { font-weight: 600; }
  .pop .ev .m { color: var(--muted); font-size: 13px; }
  .pop .ev p { margin: 3px 0 0; font-size: 13px; }

  .legend-note { position: absolute; z-index: 500; right: 10px; bottom: 28px; background: rgba(255,255,255,.95); border-radius: 8px;
                 padding: 6px 10px; font-size: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.25); }

  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 46% 54%; }
    .app > .mapwrap { order: -1; }
    .side { border-right: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <header>
      <h1>Garden City Event Map</h1>
      <p>Pick a date &amp; time to see what's happening and where.</p>
    </header>

    <section class="controls" aria-label="Date and time">
      <div class="row">
        <button id="prevDay" title="Previous day" aria-label="Previous day">◀</button>
        <label class="field">Date <input type="date" id="date"></label>
        <label class="field">Time <input type="time" id="time" step="900"></label>
        <button id="nextDay" title="Next day" aria-label="Next day">▶</button>
      </div>
      <div>
        <input type="range" id="slider" min="0" max="1425" step="15" aria-label="Time of day">
        <div class="slider-labels"><span>12 AM</span><span>6 AM</span><span>12 PM</span><span>6 PM</span><span>12 AM</span></div>
      </div>
      <div class="row">
        <button id="now" class="primary">Now</button>
        <label class="field" style="margin:0">
          <select id="window" aria-label="How far ahead to show upcoming events">
            <option value="day">Upcoming: rest of that day</option>
            <option value="week" selected>Upcoming: next 7 days</option>
            <option value="all">Upcoming: all future</option>
            <option value="none">Only events happening then</option>
          </select>
        </label>
      </div>
      <div class="chips" id="chips" aria-label="Categories"></div>
      <label class="check"><input type="checkbox" id="showEnded"> Also show events that already ended that day</label>
    </section>

    <div class="summary" id="summary"></div>
    <div class="list" id="list" aria-live="polite"></div>
  </aside>

  <main class="mapwrap" style="position:relative; min-height:0">
    <div id="map"></div>
    <div class="legend-note">
      <span class="dot" style="background:var(--active)"></span>Happening now
      &nbsp;<span class="dot" style="background:var(--upcoming)"></span>Upcoming
    </div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="events.js"></script>
<script>
(function () {
  "use strict";

  const TZ = "America/Chicago";            // Garden City, KS
  const CENTER = [37.9717, -100.8727];
  const CATEGORIES = {
    music:     { label: "Music",     icon: "🎵", color: "#fde7f3" },
    food:      { label: "Food",      icon: "🍔", color: "#fff0d6" },
    family:    { label: "Family",    icon: "🎈", color: "#e6f4ea" },
    sports:    { label: "Sports",    icon: "🏃", color: "#e0efff" },
    arts:      { label: "Arts",      icon: "🎨", color: "#efe7ff" },
    community: { label: "Community", icon: "🤝", color: "#e8eef5" },
  };
  const FALLBACK_CAT = { label: "Other", icon: "📍", color: "#eee" };
  const cat = (k) => CATEGORIES[k] || FALLBACK_CAT;

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  /* ---- time helpers: everything is a naive "YYYY-MM-DDTHH:MM" string in Garden City time,
          so string comparison == chronological comparison. ---- */
  function nowLocal() {
    const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA", {
      timeZone: TZ, hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit",
    }).formatToParts(new Date()).map((x) => [x.type, x.value]));
    return { date: `${p.year}-${p.month}-${p.day}`, time: `${p.hour}:${p.minute}` };
  }
  function addDays(dateStr, n) {
    const [y, m, d] = dateStr.split("-").map(Number);
    return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10);
  }
  const toDate = (s) => { const [d, t] = s.split("T"); const [y, m, dd] = d.split("-").map(Number); const [h, mi] = t.split(":").map(Number); return new Date(y, m - 1, dd, h, mi); };
  const fmtDay = (s) => toDate(s).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  const fmtTime = (s) => toDate(s).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  function fmtRange(e) {
    const sameDay = e.start.slice(0, 10) === e.end.slice(0, 10);
    return sameDay ? `${fmtDay(e.start)} · ${fmtTime(e.start)} – ${fmtTime(e.end)}`
                   : `${fmtDay(e.start)} ${fmtTime(e.start)} – ${fmtDay(e.end)} ${fmtTime(e.end)}`;
  }
  const minutesOf = (t) => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
  const timeOf = (mins) => `${String(Math.floor(mins / 60)).padStart(2, "0")}:${String(mins % 60).padStart(2, "0")}`;

  /* ---- state ---- */
  const state = { date: "", time: "", window: "week", showEnded: false, cats: new Set(Object.keys(CATEGORIES)) };
  const moment = () => `${state.date}T${state.time}`;

  const venues = window.VENUES || {};
  const events = (window.EVENTS || []).filter((e) => {
    const ok = venues[e.venue] && /^\d{4}-\d\d-\d\dT\d\d:\d\d$/.test(e.start) && /^\d{4}-\d\d-\d\dT\d\d:\d\d$/.test(e.end);
    if (!ok) console.warn("Skipping invalid event:", e);
    return ok;
  });

  function statusOf(e, T) {
    if (e.end <= T) return "ended";
    if (e.start <= T) return "active";
    return "upcoming";
  }
  function inWindow(e, T) {
    const day = T.slice(0, 10);
    switch (state.window) {
      case "none": return false;
      case "day":  return e.start < `${addDays(day, 1)}T00:00`;
      case "week": return e.start < `${addDays(day, 7)}T${T.slice(11)}`;
      default:     return true;
    }
  }
  function visibleEvents() {
    const T = moment();
    const dayStart = `${state.date}T00:00`;
    return events
      .filter((e) => state.cats.has(e.category))
      .map((e) => ({ ...e, status: statusOf(e, T) }))
      .filter((e) => {
        if (e.status === "active") return true;
        if (e.status === "upcoming") return inWindow(e, T);
        return state.showEnded && e.end > dayStart;   // ended earlier that same day
      })
      .sort((a, b) => a.start.localeCompare(b.start) || a.title.localeCompare(b.title));
  }

  /* ---- map ---- */
  const map = L.map("map", { zoomControl: true }).setView(CENTER, 13);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  }).addTo(map);
  const layer = L.layerGroup().addTo(map);
  const markers = {};   // venueId -> marker

  const badge = (s) => `<span class="badge ${s}">${s === "active" ? "Happening now" : s === "upcoming" ? "Upcoming" : "Ended"}</span>`;

  function popupHtml(venueId, evs) {
    return `<div class="pop"><h3>${esc(venues[venueId].name)}</h3>` + evs.map((e) =>
      `<div class="ev"><div class="t">${cat(e.category).icon} ${esc(e.title)} ${badge(e.status)}</div>
       <div class="m">${esc(fmtRange(e))}</div>${e.desc ? `<p>${esc(e.desc)}</p>` : ""}</div>`).join("") + `</div>`;
  }

  function render() {
    const evs = visibleEvents();
    const byVenue = {};
    evs.forEach((e) => (byVenue[e.venue] ||= []).push(e));

    const openVenue = Object.keys(markers).find((id) => markers[id].isPopupOpen());
    layer.clearLayers();
    Object.keys(markers).forEach((k) => delete markers[k]);

    Object.entries(byVenue).forEach(([id, list]) => {
      const v = venues[id];
      const s = list.some((e) => e.status === "active") ? "active" : list.some((e) => e.status === "upcoming") ? "upcoming" : "ended";
      const icon = L.divIcon({
        className: "", iconSize: [36, 36], iconAnchor: [18, 18], popupAnchor: [0, -18],
        html: `<div class="pin ${s}">${cat(list[0].category).icon}${list.length > 1 ? `<span class="n">${list.length}</span>` : ""}</div>`,
      });
      const m = L.marker([v.lat, v.lng], { icon, title: v.name, zIndexOffset: s === "active" ? 1000 : 0 })
        .bindPopup(popupHtml(id, list)).addTo(layer);
      markers[id] = m;
    });
    if (openVenue && markers[openVenue]) markers[openVenue].openPopup();

    /* summary */
    const active = evs.filter((e) => e.status === "active").length;
    const upcoming = evs.filter((e) => e.status === "upcoming").length;
    $("summary").innerHTML =
      `<span><span class="dot" style="background:var(--active)"></span><b>${active}</b> happening</span>` +
      `<span><span class="dot" style="background:var(--upcoming)"></span><b>${upcoming}</b> upcoming</span>` +
      `<span>${fmtDay(moment())}, ${fmtTime(moment())}</span>`;

    /* list */
    const list = $("list");
    if (!evs.length) {
      list.innerHTML = `<div class="empty">No events match this date and time.<br>Try a later time, a wider “Upcoming” range, or more categories.</div>`;
    } else {
      list.innerHTML = evs.map((e, i) =>
        `<button class="item" data-i="${i}"><div class="t">${cat(e.category).icon} ${esc(e.title)} ${badge(e.status)}</div>
         <div class="m">${esc(fmtRange(e))}</div><div class="m">📍 ${esc(venues[e.venue].name)}</div></button>`).join("");
      list.querySelectorAll(".item").forEach((btn) => btn.addEventListener("click", () => {
        const m = markers[evs[+btn.dataset.i].venue];
        if (!m) return;
        map.flyTo(m.getLatLng(), Math.max(map.getZoom(), 15), { duration: 0.6 });
        m.openPopup();
      }));
    }
    saveHash();
  }

  function fitAll() {
    const pts = Object.values(markers).map((m) => m.getLatLng());
    if (pts.length > 1) map.fitBounds(L.latLngBounds(pts).pad(0.25), { maxZoom: 15 });
    else if (pts.length === 1) map.setView(pts[0], 15);
    else map.setView(CENTER, 13);
  }

  /* ---- controls ---- */
  function syncInputs() {
    $("date").value = state.date;
    $("time").value = state.time;
    $("slider").value = Math.min(1425, Math.floor(minutesOf(state.time) / 15) * 15);
    $("window").value = state.window;
    $("showEnded").checked = state.showEnded;
  }
  function setMoment(date, time) {
    if (date) state.date = date;
    if (time) state.time = time;
    syncInputs();
    render();
  }

  $("date").addEventListener("change", (e) => e.target.value && setMoment(e.target.value));
  $("time").addEventListener("change", (e) => e.target.value && setMoment(null, e.target.value));
  $("slider").addEventListener("input", (e) => setMoment(null, timeOf(+e.target.value)));
  $("prevDay").addEventListener("click", () => setMoment(addDays(state.date, -1)));
  $("nextDay").addEventListener("click", () => setMoment(addDays(state.date, 1)));
  $("now").addEventListener("click", () => { const n = nowLocal(); setMoment(n.date, n.time); });
  $("window").addEventListener("change", (e) => { state.window = e.target.value; render(); });
  $("showEnded").addEventListener("change", (e) => { state.showEnded = e.target.checked; render(); });

  const chips = $("chips");
  Object.entries(CATEGORIES).forEach(([key, c]) => {
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.style.background = c.color; b.setAttribute("aria-pressed", "true");
    b.textContent = `${c.icon} ${c.label}`;
    b.addEventListener("click", () => {
      state.cats.has(key) ? state.cats.delete(key) : state.cats.add(key);
      b.setAttribute("aria-pressed", String(state.cats.has(key)));
      render();
    });
    chips.appendChild(b);
  });

  /* ---- shareable link: #d=2026-10-10&t=18:00&w=week ---- */
  function saveHash() {
    try { history.replaceState(null, "", `#d=${state.date}&t=${state.time}&w=${state.window}`); } catch (_) {}
  }
  function loadHash() {
    const h = new URLSearchParams(location.hash.slice(1));
    const d = h.get("d"), t = h.get("t"), w = h.get("w");
    if (d && /^\d{4}-\d\d-\d\d$/.test(d)) state.date = d;
    if (t && /^([01]\d|2[0-3]):[0-5]\d$/.test(t)) state.time = t;
    if (["day", "week", "all", "none"].includes(w)) state.window = w;
  }

  const n = nowLocal();
  state.date = n.date; state.time = n.time;
  loadHash();
  syncInputs();
  render();
  fitAll();
})();
</script>
</body>
</html>
