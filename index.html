<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15241d">
<meta name="description" content="What's happening in Garden City, Kansas, and where. Pick a date and time to see live and upcoming events on the map.">
<title>Garden City Event Map</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GC Events">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
  /* Layout concept: map-first. Phone = full-bleed map, a floating "when" bar on top and a draggable bottom sheet
     for the list / details. Desktop = the same pieces stacked in a left panel beside the map. */
  :root {
    --bg: #eef2ef; --surface: #ffffff; --surface-2: #f4f7f5;
    --ink: #15241d; --ink-2: #3a4a42; --muted: #66756d;
    --line: #dde4df; --line-strong: #c3cec7;
    --gold: #f0b429; --gold-ink: #3a2a00; --link: #8a5a00;
    --live: #1b8f4b; --live-bg: #e3f5ea; --soon: #3556d8; --soon-bg: #e8edfd;
    --shadow: 0 6px 24px rgba(15, 30, 22, .18), 0 1px 3px rgba(15, 30, 22, .12);
    --font: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --display: "Fraunces", Georgia, "Times New Roman", serif;
    --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1613; --surface: #16201b; --surface-2: #1d2a23;
      --ink: #eaf1ec; --ink-2: #c5d2ca; --muted: #9fb0a6;
      --line: #263229; --line-strong: #3a4a40;
      --link: #f0b429; --live: #3ddc84; --live-bg: #12331f; --soon: #8aa4ff; --soon-bg: #1b2547;
      --shadow: 0 6px 24px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: var(--bg); }
  body { font: 400 15px/1.45 var(--font); color: var(--ink); overflow: hidden; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  svg.ico { flex: none; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .app { position: relative; height: 100vh; height: 100dvh; overflow: hidden; --sheet-h: 0px; --top-h: 0px; }
  #map { position: absolute; inset: 0; z-index: 0; }

  /* ---------- top: when + filters ---------- */
  .top { position: absolute; z-index: 1200; left: 0; right: 0; top: 0; padding: calc(var(--safe-t) + 8px) 10px 0; display: grid; gap: 8px; pointer-events: none; }
  .top > * { pointer-events: auto; }
  .brand { display: none; }
  .card { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); }

  .when-bar { display: flex; align-items: center; gap: 8px; padding: 8px; }
  .when-summary { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 8px 0 6px; border: 0; background: none; text-align: left; border-radius: 12px; }
  .when-summary .sun { width: 28px; height: 28px; border-radius: 50%; background: var(--gold); display: grid; place-items: center; flex: none; }
  .when-summary .sun i { width: 10px; height: 10px; border-radius: 50%; background: var(--ink); }
  .when-summary .txt { flex: 1; min-width: 0; display: grid; line-height: 1.15; }
  .when-summary .d { font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .when-summary .t { color: var(--muted); font-size: 13px; }
  .when-summary .chev { transition: transform .2s; color: var(--muted); }
  .when.open .when-summary .chev { transform: rotate(180deg); }
  .btn-now { height: 44px; padding: 0 16px; border-radius: 12px; border: 0; background: var(--gold); color: var(--gold-ink); font-weight: 700; }
  .icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--ink); }
  .icon-btn:active, .btn-now:active { transform: scale(.96); }
  .when-bar { gap: 6px; padding: 8px 8px 8px 6px; }
  .when-bar .icon-btn { width: 42px; height: 42px; }
  .when-bar .btn-now { padding: 0 14px; height: 42px; }
  .when-summary { padding: 0 2px; }
  @media (max-width: 380px) { .when-summary .chev { display: none; } }

  .when-body { display: none; gap: 12px; padding: 4px 12px 14px; max-height: calc(100dvh - 120px - var(--safe-t)); overflow-y: auto; overscroll-behavior: contain; }
  .when.open .when-body { display: grid; }
  @media (max-width: 760px) { .when.open + .chips { display: none; } }

  .days { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -12px; padding: 2px 12px; scroll-snap-type: x proximity; }
  .days::-webkit-scrollbar, .chips::-webkit-scrollbar { display: none; }
  .day { position: relative; flex: none; width: 54px; height: 68px; padding: 0; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; line-height: 1.1; scroll-snap-align: center; }
  .day .w { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .day .n { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .day .c { height: 12px; font-size: 10.5px; font-weight: 700; color: var(--soon); font-variant-numeric: tabular-nums; }
  .day.today .w { color: var(--link); }
  .day[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
  .day[aria-pressed="true"] .w, .day[aria-pressed="true"] .c { color: var(--gold); }
  .day.pick { gap: 3px; }
  .day.pick { position: relative; cursor: pointer; width: 60px; border-style: dashed; color: var(--muted); }
  .day.pick span { font-size: 11px; font-weight: 600; }
  .day.pick input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 16px; }

  .time-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .time-big { font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .time-big small { font-family: var(--font); font-size: 14px; font-weight: 700; color: var(--muted); margin-left: 4px; }
  .quick { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .quick button { height: 32px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .quick button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }

  .slider-wrap { position: relative; padding-top: 30px; }
  .density { position: absolute; left: 14px; right: 14px; top: 0; height: 28px; display: flex; align-items: flex-end; gap: 2px; pointer-events: none; }
  .density i { flex: 1; min-height: 3px; border-radius: 2px 2px 0 0; background: var(--line-strong); opacity: .8; }
  .density i.on { background: var(--live); opacity: 1; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; margin: 0; background: transparent; touch-action: pan-y; }
  input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: var(--line-strong); }
  input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--line-strong); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: -11px; border-radius: 50%; background: var(--gold); border: 4px solid var(--ink); box-shadow: 0 2px 6px rgba(0,0,0,.3); }
  input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: var(--gold); border: 4px solid var(--ink); box-shadow: 0 2px 6px rgba(0,0,0,.3); }
  .ticks { display: flex; justify-content: space-between; margin: -6px 6px 0; font-size: 11px; color: var(--muted); }

  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 3px; background: var(--surface-2); border-radius: 12px; border: 1px solid var(--line); }
  .seg button { min-height: 38px; padding: 4px 2px; border: 0; border-radius: 9px; background: none; font-size: 12.5px; font-weight: 600; line-height: 1.15; color: var(--ink-2); }
  .seg button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 4px rgba(0,0,0,.18); color: var(--ink); }

  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 2px 6px; margin: 0 -10px; padding-left: 10px; padding-right: 10px; }
  .chip { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 13px 0 11px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-size: 14px; font-weight: 600; color: var(--muted); }
  .chip svg { color: var(--c, var(--muted)); }
  .chip[aria-pressed="true"] { color: var(--ink); border-color: var(--c, var(--ink)); background: var(--surface); box-shadow: inset 0 0 0 1px var(--c, var(--ink)), 0 1px 3px rgba(0,0,0,.12); }
  .chip.ghost { --c: var(--ink-2); }

  /* ---------- floating map buttons ---------- */
  .fabs { position: absolute; z-index: 900; right: 10px; top: calc(var(--top-h) + 6px); display: grid; gap: 8px; }
  .fab { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; }
  .app[data-sheet="full"] .fabs { display: none; }
  .attrib { position: absolute; z-index: 800; left: 8px; bottom: calc(var(--sheet-h) + 6px); max-width: calc(100% - 16px); padding: 2px 7px; border-radius: 6px; background: color-mix(in srgb, var(--surface) 88%, transparent); font-size: 10.5px; color: var(--muted); transition: bottom .28s cubic-bezier(.2,.8,.2,1); }
  .attrib a { color: inherit; }
  .leaflet-container { font-family: var(--font); background: #f1eee6; }
  @media (prefers-color-scheme: dark) { .leaflet-container { background: #161e1a; } }
  .leaflet-control-zoom { display: none; }

  /* ---------- map pins ---------- */
  .pin { position: relative; width: 40px; height: 40px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; border: 3px solid #fff; box-shadow: 0 3px 10px rgba(0,0,0,.35); transition: transform .15s; }
  .pin.upcoming { box-shadow: 0 3px 10px rgba(0,0,0,.35), 0 0 0 3px color-mix(in srgb, var(--soon) 70%, transparent); }
  .pin.ended { filter: grayscale(.9); opacity: .65; }
  .pin.active::after { content: ""; position: absolute; inset: -7px; border-radius: 50%; border: 3px solid var(--live); animation: pulse 1.8s ease-out infinite; }
  .pin.active::before { content: ""; position: absolute; top: -5px; left: -5px; width: 14px; height: 14px; border-radius: 50%; background: var(--live); border: 2px solid #fff; z-index: 1; }
  .pin .n { position: absolute; top: -9px; right: -9px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--ink); color: var(--surface); font: 700 11px/20px var(--font); text-align: center; border: 2px solid #fff; }
  .pin.cluster { width: 50px; height: 50px; border-width: 3px; padding: 0; }
  .pin.cluster span { width: 30px; height: 30px; border-radius: 50%; background: #fff; color: #15241d; display: grid; place-items: center; font: 700 15px var(--font); box-shadow: 0 0 0 2px rgba(0,0,0,.08); }
  .pin.cluster::before { top: -6px; left: -6px; }
  .plabel { position: absolute; top: 46px; left: 50%; transform: translateX(-50%); white-space: nowrap; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.96); color: #15241d; font: 600 12px var(--font); box-shadow: 0 2px 8px rgba(0,0,0,.25); pointer-events: none; }
  @media (prefers-color-scheme: dark) { .plabel { background: rgba(22,32,27,.96); color: #eaf1ec; } }
  .pin.sel { transform: scale(1.25); z-index: 5; }
  @keyframes pulse { from { transform: scale(.85); opacity: 1; } to { transform: scale(1.5); opacity: 0; } }
  .me { width: 18px; height: 18px; border-radius: 50%; background: var(--soon); border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(53, 86, 216, .25); }

  /* ---------- bottom sheet ---------- */
  .sheet { position: absolute; z-index: 1100; left: 0; right: 0; bottom: 0; height: var(--h, 50%); display: flex; flex-direction: column; background: var(--surface); border-radius: 22px 22px 0 0; box-shadow: 0 -8px 28px rgba(0,0,0,.22); transition: height .28s cubic-bezier(.2,.8,.2,1); }
  .sheet.dragging { transition: none; }
  .grab { flex: none; touch-action: none; padding: 6px 16px 8px; cursor: grab; user-select: none; -webkit-user-select: none; }
  .handle { display: block; width: 100%; height: 22px; padding: 0; border: 0; background: none; position: relative; }
  .handle::after { content: ""; position: absolute; left: 50%; top: 9px; width: 42px; height: 5px; margin-left: -21px; border-radius: 3px; background: var(--line-strong); }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 40px; }
  .sheet-head .sum { display: flex; flex-wrap: wrap; gap: 4px 14px; font-weight: 700; font-size: 15px; }
  .sheet-head .sum span { display: inline-flex; align-items: center; gap: 6px; }
  .sheet-head .sum i { width: 10px; height: 10px; border-radius: 50%; }
  .sheet-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 0 12px calc(24px + var(--safe-b)); }

  .gh { position: sticky; top: 0; z-index: 2; margin: 0; padding: 14px 4px 6px; background: var(--surface); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .gh.live { color: var(--live); }
  .gh b { font-weight: 700; padding: 0 7px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); letter-spacing: 0; }
  .ev { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 8px; border: 0; border-radius: 14px; background: none; text-align: left; }
  .ev:active, .ev:hover { background: var(--surface-2); }
  .ev-ico { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--c); background: color-mix(in srgb, var(--c) 14%, var(--surface)); }
  .ev-main { flex: 1; min-width: 0; display: grid; gap: 1px; }
  .ev-title { font-weight: 700; font-size: 15.5px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ev-meta { font-size: 13.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev-meta.when { color: var(--ink-2); font-weight: 600; }
  .tag { flex: none; align-self: center; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; background: var(--soon-bg); color: var(--soon); }
  .tag.live { background: var(--live-bg); color: var(--live); display: inline-flex; align-items: center; gap: 5px; }
  .tag.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--live); animation: blink 1.6s ease-in-out infinite; }
  .tag.ended { background: var(--surface-2); color: var(--muted); }
  @keyframes blink { 50% { opacity: .3; } }

  .empty { padding: 36px 20px; text-align: center; color: var(--muted); }
  .empty h3 { margin: 0 0 6px; font-family: var(--display); font-size: 20px; color: var(--ink); }
  .empty p { margin: 0 auto; max-width: 30ch; }
  .install { margin: 18px 4px 0; padding: 14px; border-radius: 14px; background: var(--surface-2); display: grid; gap: 8px; font-size: 14px; }
  .install p { margin: 0; color: var(--ink-2); }
  .foot { margin: 22px 4px 0; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .foot a { color: var(--link); }

  /* ---------- venue detail ---------- */
  .back { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px 0 8px; border-radius: 12px; border: 0; background: var(--surface-2); font-weight: 600; }
  .detail { display: grid; gap: 14px; padding-top: 4px; }
  .detail h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1.15; text-wrap: balance; }
  .addr { margin: 4px 0 0; color: var(--muted); display: flex; gap: 6px; align-items: flex-start; }
  .note { margin: 0; font-size: 13px; color: var(--link); }
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn { white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 44px; padding: 0 15px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14.5px; text-decoration: none; }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
  .btn.grow { flex: 1; }
  .btn.small { min-height: 40px; padding: 0 12px; font-size: 13.5px; }
  .sub { margin: 4px 0 -6px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .evd { display: grid; gap: 10px; padding: 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); }
  .evd.focus { border-color: var(--gold); box-shadow: 0 0 0 2px color-mix(in srgb, var(--gold) 45%, transparent); }
  .evd-top { display: flex; gap: 12px; align-items: flex-start; }
  .evd h3 { margin: 0; font-size: 17px; line-height: 1.25; }
  .evd .meta { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  .evd .desc { margin: 0; color: var(--ink-2); font-size: 14.5px; }

  /* ---------- dialog + toast ---------- */
  dialog { border: 0; padding: 0; color: var(--ink); background: var(--surface); width: 100%; max-width: 100%; margin: auto 0 0; border-radius: 22px 22px 0 0; box-shadow: var(--shadow); }
  dialog::backdrop { background: rgba(8, 16, 12, .5); }
  .dlg { display: grid; gap: 12px; padding: 18px 16px calc(18px + var(--safe-b)); }
  .dlg h2 { margin: 0; font-family: var(--display); font-size: 22px; }
  .dlg p { margin: 0; color: var(--muted); font-size: 14px; }
  .dlg .btn { justify-content: flex-start; }
  .dlg .btn[disabled] { opacity: .5; }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .toast { position: absolute; z-index: 2000; left: 50%; bottom: calc(var(--sheet-h) + 18px); transform: translate(-50%, 20px); max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 12px; background: var(--ink); color: var(--surface); font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
  .app.plan-open .toast { bottom: calc(86px + var(--safe-b)); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- desktop ---------- */
  @media (min-width: 761px) {
    .app { display: grid; grid-template-columns: 420px 1fr; grid-template-rows: auto minmax(0, 1fr); }
    #map { position: relative; inset: auto; grid-column: 2; grid-row: 1 / 3; }
    .top { position: relative; grid-column: 1; grid-row: 1; padding: 18px 16px 0; background: var(--surface); gap: 12px; pointer-events: auto; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand .sun { width: 36px; height: 36px; border-radius: 50%; background: var(--gold); display: grid; place-items: center; flex: none; }
    .brand .sun i { width: 13px; height: 13px; border-radius: 50%; background: var(--ink); }
    .brand h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 23px; line-height: 1.1; }
    .brand p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
    .brand p a { color: var(--link); }
    .card { box-shadow: none; border: 1px solid var(--line); background: var(--surface-2); }
    .day { background: var(--surface); }
    .chips { flex-wrap: wrap; overflow: visible; margin: 0; padding: 0 0 12px; }
    .chip { height: 34px; font-size: 13.5px; box-shadow: none; }
    .chip[aria-pressed="true"] { box-shadow: inset 0 0 0 1px var(--c, var(--ink)); }
    .sheet { position: relative; grid-column: 1; grid-row: 2; height: auto; border-radius: 0; box-shadow: none; border-top: 1px solid var(--line); transition: none; }
    .grab { cursor: default; padding-top: 10px; }
    .handle { display: none; }
    .fabs { top: 12px; }
    .attrib { bottom: 6px; left: auto; right: 8px; }
    .leaflet-control-zoom { display: block; }
    .toast { left: calc(420px + (100% - 420px) / 2); bottom: 20px; }
    .app.plan-open .toast { left: 50%; }
    dialog { margin: auto; max-width: 440px; border-radius: 22px; }
  }

  /* ---------- hearts + plan button ---------- */
  .evrow { display: flex; align-items: center; }
  .evrow .ev { flex: 1; min-width: 0; }

    const drawing = planAnimate; planAnimate = false;
    let out = `<svg class="${drawing ? "draw" : ""}" viewBox="${-half} ${-half} ${half * 2} ${half * 2}" role="group" aria-label="Clock of your day, ${planHalf === "am" ? "morning" : "afternoon"}">`;
    out += `<circle class="face" r="${G.FACE}" fill="#14132a" stroke="rgba(255,255,255,.07)" stroke-width="2"/>`;
    for (let i = 0; i < 60; i++) {                                       // minute dots, bigger on the hours
      const [x, y] = polar(G.FACE - 9, i * 6);
      out += i % 5 === 0 ? `<circle cx="${f2(x)}" cy="${f2(y)}" r="2.3" fill="#fff"/>` : `<circle cx="${f2(x)}" cy="${f2(y)}" r="1" fill="rgba(255,255,255,.35)"/>`;
    }
    for (let h = 1; h <= 12; h++) { const [x, y] = polar(G.FACE - 38, h * 30); out += `<text x="${f2(x)}" y="${f2(y)}" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, system-ui, sans-serif" font-weight="700" font-size="22" fill="#fff" pointer-events="none">${h}</text>`; }

    items.forEach((it, i) => {
      const e = it.e, r = laneR(it.lane), cap = ((th / 2 / r) * 180) / Math.PI, c = cat(e.category).color;
      const a1 = Math.min(it.vs + cap, it.mid - 0.05), a2 = Math.max(it.ve - cap, it.mid + 0.05);
      const status = statusOf(e, T), top = Math.cos((it.mid * Math.PI) / 180) >= 0;
      const visLen = ((it.ve - it.vs) * Math.PI * r) / 180, maxChars = Math.max(3, Math.floor((visLen - 18) / cw));
      const label = e.title.length > maxChars ? e.title.slice(0, Math.max(1, maxChars - 1)).trimEnd() + "…" : e.title;
      const tr = top ? r - fs * 0.35 : r + fs * 0.35;                                // text sits on its path: flip direction on the lower half so it reads upright
      const textPath = top ? arcD(tr, a1, a2, 1) : arcD(tr, a2, a1, 0);
      const done = status === "ended", sel = planSel === e.uid;
      const spoken = `${e.title}, ${timeRange(e)}, ${venues[e.venue].name}`;
      out += `<g class="pev" style="--k:${i}" data-uid="${esc(e.uid)}" tabindex="0" role="button" aria-label="${esc(spoken)}" opacity="${done ? 0.5 : 1}">`;
      if (sel) out += `<path d="${arcD(r, a1, a2, 1)}" fill="none" stroke="#fff" stroke-width="${th + 6}" stroke-linecap="round" opacity=".95"/>`;
      out += `<path class="main" pathLength="1" d="${arcD(r, a1, a2, 1)}" fill="none" stroke="${c}" stroke-width="${th}" stroke-linecap="round"/>`;
      if (status === "active" && !e.open) {                              // the part of the block that has already happened is darker
        const now = Math.min(Math.max((tm - (planHalf === "am" ? 0 : 720)) / 2, a1), a2);
        if (now > a1 + 0.2) out += `<path d="${arcD(r, a1, now, 1)}" fill="none" stroke="rgba(0,0,0,.3)" stroke-width="${th}" stroke-linecap="round"/>`;
      }
      out += `<path id="tp${i}" d="${textPath}" fill="none"/><text style="font-size:${fs}px"><textPath href="#tp${i}" xlink:href="#tp${i}" startOffset="50%" text-anchor="middle">${esc(label)}</textPath></text>`;
      if (it.clippedStart || it.clippedEnd) { const [x, y] = polar(r, it.clippedStart ? a1 : a2); out += `<circle cx="${f2(x)}" cy="${f2(y)}" r="3" fill="#fff" opacity=".9"/>`; }   // runs past noon/midnight
      out += `</g>`;
    });

    // hands: they show the selected time and can be dragged
    const hAng = ((tm / 60) % 12) * 30, mAng = (tm % 60) * 6;
    out += `<g id="hands" pointer-events="none"><line id="hh" x2="0" y2="${-G.FACE * 0.52}" stroke="#7a7699" stroke-width="9" stroke-linecap="round" transform="rotate(${hAng})"/>`
         + `<line id="mh" x2="0" y2="${-G.FACE * 0.84}" stroke="#8f8bb0" stroke-width="6" stroke-linecap="round" transform="rotate(${mAng})"/>`
         + `<circle r="8" fill="#fff"/><circle r="3" fill="#14132a"/></g>`;
    out += `<circle id="faceHit" class="face" r="${G.FACE}" fill="transparent"/>`;       // on top, to catch drags
    out += `</svg>`;
    $("planClock").innerHTML = out;

    // time readout + stepper
    const ct = clockTime(state.time);
    $("planTime").innerHTML = `<button class="pbtn" type="button" data-step="-30" aria-label="30 minutes earlier">${svg("minus", 18)}</button><output id="planOut" aria-live="polite">${ct.txt}<small>${ct.ap}</small></output><button class="pbtn" type="button" data-step="30" aria-label="30 minutes later">${svg("plus", 18)}</button><button class="nowbtn" type="button" data-now>Now</button>`;

    // selected block card
    const selE = planSel && events.find((x) => x.uid === planSel);
    if (selE && plan.has(selE.uid)) {
      const v = venues[selE.venue];
      $("planCard").innerHTML = `<h3>${esc(selE.title)}</h3><p>${esc(timeRange(selE))} · ${esc(v.name)}</p>
        <div class="btn-row"><a class="btn primary grow" href="${esc(mapsUrl(selE.venue, "dir"))}" target="_blank" rel="noopener">${svg("nav", 18)} Directions</a>
        <button class="btn" type="button" data-showmap="${selE.idx}">${svg("pin", 17)} On map</button>
        <button class="btn" type="button" data-plan="${selE.idx}">${svg("x", 17)} Remove</button></div>`;
    } else if (list.length || allDay.length) {
      $("planCard").innerHTML = `<p class="hint">Tap a block for details. Drag the clock face, or use − and +, to move the time.</p>`;
    } else {
      $("planCard").innerHTML = `<p class="hint"><b style="color:#fff">Nothing planned for ${esc(dayShort(state.date))}.</b><br>Tap the ♡ on any event, or add one from the list below, and it appears on the clock.</p>`;
    }

    // list: your day, with travel hints; all-day; ideas
    const row = (e, planned) => { const v = venues[e.venue]; return `<div class="prow${planSel === e.uid ? " sel" : ""}" style="--c:${cat(e.category).color}"><span class="dot"></span>
        <button class="pt" type="button" data-pick="${e.idx}" style="all:unset;flex:1;min-width:0;display:grid;gap:1px;cursor:pointer"><b>${esc(e.title)}</b><span>${esc(timeRange(e))} · ${esc(v.name)}</span></button>
        <button class="pbtn" type="button" data-plan="${e.idx}" aria-label="${planned ? "Remove" : "Add"} ${esc(e.title)}">${svg(planned ? "x" : "plus", 18)}</button></div>`; };
    let html = "";
    if (list.length || allDay.length) {
      const first = list[0], last = list[list.length - 1];
      html += `<div class="psec">Your day <span>${list.length} event${list.length === 1 ? "" : "s"}${first ? ` · ${timeStr(first.start)} – ${timeStr(last.end)}` : ""}</span></div>`;
      allDay.forEach((e) => { html += row(e, true); });
      list.forEach((e, i) => {
        html += row(e, true);
        const nx = list[i + 1]; if (!nx) return;
        const gap = Math.round(toMin(nx.start) - toMin(e.end)), a = venues[e.venue], b = venues[nx.venue];
        const drive = e.venue === nx.venue ? 0 : Math.max(3, Math.round(km(a, b) / 0.8) + 2);   // ~30 mph around town, plus parking
        if (gap < 0) html += `<div class="gapnote warn">${svg("alert", 15)} Overlaps with the next event by ${-gap} min</div>`;
        else if (e.venue === nx.venue) html += `<div class="gapnote">Same place · ${gap} min between</div>`;
        else if (gap < drive) html += `<div class="gapnote warn">${svg("alert", 15)} Tight: ${gap} min between, about ${drive} min to drive</div>`;
        else html += `<div class="gapnote">${gap} min between · about ${drive} min to drive</div>`;
      });
    }
    const more = events.filter((e) => !e.allDay && !plan.has(e.uid) && touchesDay(e, state.date)).sort((a, b) => a.start.localeCompare(b.start));
    if (more.length) {
      html += `<div class="psec">Add to your day <span>${more.length} on ${esc(dayShort(state.date))}</span></div>`;
      more.slice(0, planAll ? 99 : 6).forEach((e) => { html += row(e, false); });
      if (more.length > 6 && !planAll) html += `<button class="btn" type="button" data-planall>Show all ${more.length}</button>`;
    }
    $("planList").innerHTML = html;

    const n = list.length + allDay.length;
    $("planCal").disabled = !n;
    $("planCal").innerHTML = `${svg("calplus", 19)} ${n ? `Add my ${n} event${n === 1 ? "" : "s"} to my calendar` : "Nothing planned yet"}`;
  }
  let planAll = false, planAnimate = false;

  function updateHands() {
    const tm = minutesOf(state.time);
    $("hh")?.setAttribute("transform", `rotate(${((tm / 60) % 12) * 30})`);
    $("mh")?.setAttribute("transform", `rotate(${(tm % 60) * 6})`);
    const ct = clockTime(state.time); const o = $("planOut"); if (o) o.innerHTML = `${ct.txt}<small>${ct.ap}</small>`;
  }
  function openPlan() {
    planHalf = minutesOf(state.time) < 720 ? "am" : "pm"; planSel = null; planAll = false; planAnimate = true;
    setWhen(false);
    pushOverlay("plan");
    $("plan").hidden = false; app.classList.add("plan-open"); renderPlan(); $("planClose").focus();
  }
  function closePlanNow() { $("plan").hidden = true; app.classList.remove("plan-open"); planDragging = false; render(); }
  function closePlan() { if (!popOverlay("plan")) closePlanNow(); }
  function togglePlan(idx) {
    const e = events[idx]; if (!e) return;
    if (plan.has(e.uid)) { plan.delete(e.uid); if (planSel === e.uid) planSel = null; toast("Removed from your day"); }
    else { plan.add(e.uid); planSel = e.uid; toast("Added to your day"); if (!e.allDay) planHalf = toMin(e.start) - toMin(`${state.date}T00:00`) < 720 ? "am" : "pm"; }
    savePlan(); render();
    try { navigator.vibrate && navigator.vibrate(12); } catch (_) {}
    if (plan.has(e.uid)) document.querySelectorAll(`.heart[data-plan="${idx}"]`).forEach((b) => b.classList.add("pop"));
  }

  // drag the clock face to set the time (snaps to 5 minutes)
  function faceTime(ev) {
    const svgEl = $("planClock").querySelector("svg"), r = svgEl.getBoundingClientRect();
    let a = (Math.atan2(ev.clientX - (r.left + r.width / 2), -(ev.clientY - (r.top + r.height / 2))) * 180) / Math.PI; if (a < 0) a += 360;
    return timeOf(((planHalf === "am" ? 0 : 720) + (Math.round((a * 2) / 5) * 5) % 720));
  }
  let dragRaf = 0;
  $("planClock").addEventListener("pointerdown", (ev) => {
    if (ev.target.id !== "faceHit") return;
    planDragging = true; ev.target.setPointerCapture(ev.pointerId);
    state.time = faceTime(ev); updateHands();
  });
  $("planClock").addEventListener("pointermove", (ev) => {
    if (!planDragging) return;
    state.time = faceTime(ev); updateHands();
    if (!dragRaf) dragRaf = requestAnimationFrame(() => { dragRaf = 0; render(); });
  });
  const endFaceDrag = () => { if (planDragging) { planDragging = false; render(); } };
  $("planClock").addEventListener("pointerup", endFaceDrag);
  $("planClock").addEventListener("pointercancel", endFaceDrag);
  $("planClock").addEventListener("click", (ev) => {
    const g = ev.target.closest(".pev"); if (!g) return;
    planSel = planSel === g.dataset.uid ? null : g.dataset.uid; renderPlan();
  });
  $("planClock").addEventListener("keydown", (ev) => {
    if ((ev.key === "Enter" || ev.key === " ") && ev.target.classList?.contains("pev")) { ev.preventDefault(); planSel = ev.target.dataset.uid; renderPlan(); }
  });

  $("plan").addEventListener("click", (ev) => {
    const t = ev.target;
    const heart = t.closest("[data-plan]"); if (heart) { togglePlan(+heart.dataset.plan); return; }
    const pick = t.closest("[data-pick]"); if (pick) { const e = events[+pick.dataset.pick]; if (plan.has(e.uid)) { planSel = e.uid; planHalf = toMin(e.start) - toMin(`${state.date}T00:00`) < 720 ? "am" : "pm"; renderPlan(); } else togglePlan(e.idx); return; }
    const step = t.closest("[data-step]"); if (step) { state.time = timeOf(Math.min(1425, Math.max(0, minutesOf(state.time) + +step.dataset.step))); render(); return; }
    if (t.closest("[data-now]")) { const n = nowLocal(); planHalf = minutesOf(n.time) < 720 ? "am" : "pm"; setMoment(n.date, n.time); return; }
    const h = t.closest("[data-h]"); if (h) { planHalf = h.dataset.h; renderPlan(); return; }
    if (t.closest("[data-planall]")) { planAll = true; renderPlan(); return; }
    const sm = t.closest("[data-showmap]"); if (sm) { const e = events[+sm.dataset.showmap]; const had = !!state.sel; closePlanNow(); try { history.replaceState(had ? { o: "venue" } : null, "", location.href); } catch (_) {} openVenue(e.venue, e.idx, true); return; }
  });
  $("planClose").addEventListener("click", closePlan);
  $("planPrev").addEventListener("click", () => { planSel = null; planAll = false; setMoment(addDays(state.date, -1)); });
  $("planNext").addEventListener("click", () => { planSel = null; planAll = false; setMoment(addDays(state.date, 1)); });
  $("planCal").addEventListener("click", () => {
    const mine = plannedFor(state.date).sort((a, b) => a.start.localeCompare(b.start)); if (!mine.length) return;
    download(`my-day-${state.date}.ics`, icsOf(mine)); toast("Calendar file downloaded");
  });

  /* ---- events ---- */
  $("whenToggle").addEventListener("click", () => setWhen(!$("when").classList.contains("open")));
  $("now").addEventListener("click", () => applyPreset("now"));
  $("slider").addEventListener("input", (e) => setMoment(null, timeOf(+e.target.value)));
  $("days").addEventListener("click", (e) => { const b = e.target.closest("[data-d]"); if (b) setMoment(b.dataset.d); });
  $("quick").addEventListener("click", (e) => { const b = e.target.closest("[data-t]"); if (b) setMoment(null, b.dataset.t); });
  $("seg").addEventListener("click", (e) => { const b = e.target.closest("[data-w]"); if (b) { state.window = b.dataset.w; state.preset = null; state.until = null; render(); } });
  $("presets").addEventListener("click", (e) => { const b = e.target.closest("[data-pre]"); if (b) applyPreset(b.dataset.pre); });
  map.on("click", () => { if (!mq.matches) setWhen(false); });
  map.on("dragstart", () => { if (!mq.matches) setWhen(false); });
  $("fit").addEventListener("click", () => { state.sel = null; render(); fitAll(); });

  $("sheetBody").addEventListener("click", (e) => {
    const ev = e.target.closest("[data-ev]");
    if (ev) { const x = events[+ev.dataset.ev]; openVenue(x.venue, x.idx, true); return; }
    if (e.target.closest("[data-install]") && installEvt) {
      installEvt.prompt();
      installEvt.userChoice.finally(() => { installEvt = null; render(); });
      return;
    }
    const heart = e.target.closest("[data-plan]");
    if (heart) { togglePlan(+heart.dataset.plan); return; }
    if (e.target.closest("[data-welcome-ok]")) { welcomed = true; try { localStorage.setItem(WELCOME_KEY, "1"); } catch (_) {} render(); return; }
    if (e.target.closest("[data-clearq]")) { setSearch(false); return; }
    if (e.target.closest("[data-opencal]")) { openCal(); return; }
    const sh = e.target.closest("[data-share]"); if (sh) { shareEvent(events[+sh.dataset.share]); return; }
    const ics = e.target.closest("[data-ics]");
    if (ics) { const x = events[+ics.dataset.ics]; download(`${slug(x.title)}.ics`, icsOf([x])); toast("Calendar file downloaded"); }
  });
  $("sheetHead").addEventListener("click", (e) => { if (e.target.closest("[data-back]")) closeVenue(); else if (e.target.closest("[data-openplan]")) openPlan(); });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape" || $("calDialog").open) return;
    if (!$("plan").hidden) closePlan(); else if (state.sel) closeVenue();
  });

  let me;
  $("locate").addEventListener("click", () => {
    if (!navigator.geolocation) return toast("Location isn't available on this device");
    navigator.geolocation.getCurrentPosition((p) => {
      const ll = L.latLng(p.coords.latitude, p.coords.longitude);
      if (me) me.setLatLng(ll); else me = L.marker(ll, { icon: L.divIcon({ className: "", iconSize: [18, 18], html: '<div class="me"></div>' }), interactive: false, keyboard: false }).addTo(map);
      focusOn(ll, 15);
    }, () => toast("Couldn't get your location"), { enableHighAccuracy: true, timeout: 10000 });
  });

  /* categories */
  const chips = $("chips");
  chips.innerHTML = Object.entries(CATEGORIES).map(([k, c]) =>
    `<button class="chip" type="button" data-cat="${k}" aria-pressed="true" style="--c:${c.color}">${svg(k, 17)}<span>${c.label}</span></button>`).join("")
    + `<button class="chip ghost" type="button" data-ended aria-pressed="false">${svg("clock", 17)}<span>Show ended</span></button>`;
  chips.addEventListener("click", (e) => {
    const b = e.target.closest(".chip"); if (!b) return;
    if (b.hasAttribute("data-ended")) state.showEnded = !state.showEnded;
    else { const k = b.dataset.cat; state.cats.has(k) ? state.cats.delete(k) : state.cats.add(k); }
    b.setAttribute("aria-pressed", String(b.hasAttribute("data-ended") ? state.showEnded : state.cats.has(b.dataset.cat)));
    render();
  });

  /* search */
  let qTimer;
  function setSearch(on) {
    $("when").classList.toggle("searching", on);
    if (on) { setWhen(false); if (state.sel) closeVenue(); if (!mq.matches && snap === "peek") applySnap("half"); $("q").focus(); }
    else { clearTimeout(qTimer); $("q").value = ""; $("q").blur(); if (state.q) { state.q = ""; render(); } }
  }
  $("searchBtn").addEventListener("click", () => setSearch(true));
  $("qClear").addEventListener("click", () => setSearch(false));
  $("searchBar").addEventListener("submit", (e) => { e.preventDefault(); $("q").blur(); });
  $("q").addEventListener("input", () => { clearTimeout(qTimer); qTimer = setTimeout(() => { state.q = $("q").value; if (state.sel) state.sel = null; render(); }, 120); });
  $("q").addEventListener("keydown", (e) => { if (e.key === "Escape") { e.stopPropagation(); setSearch(false); } });

  async function shareEvent(e) {
    const url = safeUrl(e.url) || location.href.split("#")[0];
    const text = `${e.title}: ${dayShort(e.start.slice(0, 10))}, ${timeRange(e)} at ${venues[e.venue].name}`;
    if (navigator.share) { try { await navigator.share({ title: e.title, text, url }); } catch (_) {} return; }
    try { await navigator.clipboard.writeText(`${text}\n${url}`); toast("Link copied"); } catch (_) { toast("Couldn't copy the link"); }
  }

  /* calendar dialog */
  const dlg = $("calDialog");
  function openCal() { pushOverlay("cal"); dlg.showModal ? dlg.showModal() : dlg.setAttribute("open", ""); }
  dlg.addEventListener("close", () => { popOverlay("cal"); });
  $("calBtn").addEventListener("click", openCal);
  $("calClose").addEventListener("click", () => dlg.close());
  dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); });
  $("dlVisible").addEventListener("click", () => { if (shown.length) { download(`garden-city-events-${state.date}.ics`, icsOf(shown)); toast("Calendar file downloaded"); dlg.close(); } });
  if (/^https?:$/.test(location.protocol)) {
    const feed = new URL("garden-city-events.ics", location.href).href, webcal = feed.replace(/^https?:/, "webcal:");
    $("subWebcal").href = webcal;
    $("subGoogle").href = "https://calendar.google.com/calendar/render?cid=" + encodeURIComponent(webcal);
    $("copyFeed").addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(feed); toast("Link copied"); } catch (_) { window.prompt("Copy this link:", feed); }
    });
  } else $("subBox").hidden = true;

  window.addEventListener("popstate", () => {
    const o = history.state && history.state.o;
    if (!$("plan").hidden && o !== "plan") closePlanNow();
    if (dlg.open && o !== "cal") dlg.close();
    if (state.sel && o !== "venue" && o !== "plan" && o !== "cal") closeVenueNow();
  });

  /* shareable link: #d=2026-10-10&t=18:30&w=week */
  function saveHash() { try { history.replaceState(history.state, "", `#d=${state.date}&t=${state.time}&w=${state.window}`); } catch (_) {} }
  function loadHash() {
    const h = new URLSearchParams(location.hash.slice(1)), d = h.get("d"), t = h.get("t"), w = h.get("w");
    if (d && /^\d{4}-\d\d-\d\d$/.test(d)) state.date = d;
    if (t && /^([01]\d|2[0-3]):[0-5]\d$/.test(t)) state.time = t;
    if (["day", "week", "all", "none"].includes(w)) state.window = w;
  }

  /* installable + offline */
  window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEvt = e; render(); });
  window.addEventListener("appinstalled", () => { installEvt = null; render(); toast("Installed"); });
  window.addEventListener("offline", () => toast("You're offline. Showing saved events."));
  window.addEventListener("online", () => toast("Back online"));
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    const hadController = !!navigator.serviceWorker.controller;
    let reloading = false;
    // A new version of the app took over: reload once so people never keep seeing the old one.
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController && !reloading) { reloading = true; location.reload(); } });
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }

  $("splashSun").innerHTML = sunSvg(84);
  const hideSplash = () => $("splash").classList.add("hide");
  tiles.once("load", () => setTimeout(hideSplash, 250));
  setTimeout(hideSplash, 4500);                                  // never keep people waiting on the map

  const n = nowLocal();
  state.date = n.date; state.time = n.time;
  loadHash();
  app.style.setProperty("--top-h", $("top").offsetHeight + "px");
  applySnap("half");
  setWhen(window.matchMedia("(min-width: 761px) and (min-height: 700px)").matches);   // open on roomy desktops, collapsed on phones and short screens
  render();
  if (meta.from) $("dataNote").innerHTML = `${esc(dayShort(meta.from))} – ${esc(dayShort(meta.to))} · ${Object.keys(meta.sources || {}).length} sources`;
  fitAll();
})();
</script>
</body>
</html>
