name: Update events

# What this does
#   Every morning it pulls events from the Finney County Public Library, Garden City Arts and Garden City Community
#   College (scripts/pull-feeds.js), merges them with your latest VisitGCK upload (data/visitgck.ics), places any new
#   venues on the map, and redeploys the site.
#
# VisitGCK.com blocks automated downloads (HTTP 403 to GitHub), so that one is still manual:
#   GitHub -> Add file -> Upload files -> data/visitgck.ics (export from their calendar page), commit. This workflow
#   then runs by itself. "Run workflow" below also tries downloading it first, in case they ever allow GitHub in.
on:
  schedule:
    - cron: "23 11 * * *"      # every day, about 6 AM Garden City time
  push:
    paths: ["data/visitgck.ics"]
  workflow_dispatch:

permissions:
  contents: write              # commit the refreshed data
  actions: write               # start the Pages deploy afterwards

concurrency:
  group: update-events
  cancel-in-progress: false

env:
  ICS_URLS: ${{ vars.ICS_URLS || 'https://www.visitgck.com/events-calendar/?ical=1&eventDisplay=list https://www.visitgck.com/events-calendar/?ical=1' }}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Try to download the VisitGCK calendar (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          mkdir -p data
          for url in $ICS_URLS; do
            code=$(curl -sS -L -m 60 -o /tmp/cal.ics -w '%{http_code}' -A "gardencityksevents-map/1.0 (+https://github.com/${{ github.repository }})" -H 'Accept: text/calendar' "$url" || true)
            echo "$url -> HTTP $code"
            if [ "$code" = "200" ] && head -c 15 /tmp/cal.ics | grep -q 'BEGIN:VCALENDAR' && grep -q 'BEGIN:VEVENT' /tmp/cal.ics; then
              cp /tmp/cal.ics data/visitgck.ics; echo "Saved $(grep -c 'BEGIN:VEVENT' data/visitgck.ics) events"; exit 0
            fi
          done
          echo "::notice::VisitGCK still blocks downloads. Using the last uploaded data/visitgck.ics."

      - name: Pull the local feeds (library, Garden City Arts, GCCC)
        run: node scripts/pull-feeds.js

      - name: Build, place new venues on the map, rebuild
        run: |
          node scripts/build-events.js
          node scripts/geocode.js || true
          node scripts/build-events.js

      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data events.js garden-city-events.ics scripts/venues.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "No changes."
          else
            git commit -m "Update events"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start the deploy explicitly.
      - name: Deploy site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run jekyll-gh-pages.yml --ref "${{ github.ref_name }}"
